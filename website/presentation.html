<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Презентация — WMS «Ремера»</title>
  <style>
    :root{
      --bg:#012032; --panel:#062a40; --text:#e6edf7; --muted:#9fb0c7;
      --accent:#2dd4ea; --gold:#f0b429; --border:rgba(255,255,255,.08); --navy:#002140;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
    .container{max-width:1040px;margin:0 auto;padding:0 20px;width:100%}

    nav.top{flex:0 0 auto;background:rgba(0,33,64,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(240,180,41,.25)}
    nav.top .container{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;flex-wrap:wrap}
    .logo{color:var(--gold);font-weight:700;font-size:18px;text-decoration:none;letter-spacing:.04em}
    .logo span{color:var(--accent)}
    .nav-links{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:14px;padding:8px 16px;border:1px solid rgba(240,180,41,.55);border-radius:999px;box-shadow:0 0 10px rgba(240,180,41,.28);transition:color .15s,border-color .15s,box-shadow .15s}
    .nav-links a:hover{color:var(--accent);border-color:rgba(240,180,41,.9);box-shadow:0 0 14px rgba(240,180,41,.45)}
    .nav-links a.active{color:var(--accent);font-weight:600;border-color:rgba(240,180,41,.9);box-shadow:0 0 14px rgba(240,180,41,.45)}

    .bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
    .bar h1{font-size:1rem;font-weight:600;color:var(--gold);letter-spacing:.02em}
    .bar .btn{display:inline-block;padding:8px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13.5px;color:var(--accent);border:1px solid var(--accent);transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease}
    .bar .btn:hover{transform:translateY(-1px);background:var(--accent);color:#041018;box-shadow:0 4px 16px rgba(45,212,234,.35)}

    iframe{flex:1 1 auto;width:100%;border:none;background:#0b1020;display:block}
  </style>
</head>
<body>
  <nav class="top">
    <div class="container">
      <a href="index.html" class="logo">WMS <span>«Ремера»</span></a>
      <div class="nav-links">
        <a href="index.html">Главная</a>
        <a href="app.html">Приложение</a>
        <a href="presentation.html" class="active">Презентация</a>
        <a href="pdf.html">ИАР (PDF)</a>
        <a href="about.html">О проекте</a>
      </div>
    </div>
  </nav>
  <div class="bar">
    <h1>🎤 Питч-дек «Интеллектуальная WMS Ремера» · 20 блоков</h1>
    <a class="btn" href="pitch.html" target="_blank" rel="noopener">Открыть на весь экран ↗</a>
  </div>
  <iframe src="pitch.html" title="Презентация WMS Ремера"></iframe>
</body>
</html>
