<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ремера - Внутренний чат v2</title>
<style>
  :root{--bg:#0f1420;--panel:#161d2e;--line:#2a3550;--text:#e8ecf7;--muted:#8b96b0;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--acc:#3b82f6;--lite:#dbeafe;--lite-line:#93c5fd;--lite-text:#0b1220;--lite-acc:#1e40af}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,'Segoe UI',Roboto,sans-serif}
  .hide{display:none!important}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;z-index:5}
  #dot{width:8px;height:8px;border-radius:50%;background:#555}
  #dot.on{background:var(--ok)}
  #who{color:var(--muted);font-size:12px}
  .hdr-btn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:13px}
  #logout{background:none;border:1px solid var(--line);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer}
  #tabs{display:flex;gap:6px;padding:8px 14px 0;max-width:900px;margin:0 auto}
  .tab{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px 8px 0 0;cursor:pointer}
  .tab.on{background:var(--panel);color:var(--text)}
  main{max-width:900px;margin:0 auto;padding:12px 14px 150px}
  .msg{max-width:75%;margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);white-space:pre-wrap}
  .msg .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
  .msg.me{margin-left:auto;border-color:var(--acc)}
  .msg.sys{border-color:var(--ok)}
  .qcard{border:1px solid var(--warn);border-radius:10px;padding:10px;margin:10px 0;background:var(--panel)}
  .qcard .muted{color:var(--muted);font-size:12px;margin:4px 0 8px}
  .row{display:flex;gap:8px}
  button.ok{flex:1;background:var(--ok);border:none;color:#06240f;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
  button.bad{flex:1;background:none;border:1px solid var(--bad);color:var(--bad);padding:8px;border-radius:8px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--panel)}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  th{color:var(--muted);font-weight:500}
  #bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px;z-index:30}
  #builder,#freeRow{display:flex;gap:6px;width:100%}
  #builder{flex-wrap:wrap}
  #bCmd{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;flex:1 1 130px}
  .combo{position:relative;flex:1 1 160px}
  #bCode{width:100%;background:var(--bg);border:1px solid var(--lite-line);color:var(--text);border-radius:10px;padding:8px 10px}
  #bQty{width:92px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px}
  #bList{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--lite);border:1px solid var(--lite-line);border-radius:10px;max-height:240px;overflow-y:auto;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,0.55)}
  .bItem{padding:9px 12px;font-size:12.5px;cursor:pointer;color:var(--lite-text);border-bottom:1px solid rgba(30,64,175,0.15)}
  .bItem:last-child{border-bottom:none}
  .bItem b{color:var(--lite-acc)}
  .bItem:hover{background:var(--acc);color:#fff}
  .bItem:hover b{color:#fff}
  #bSend{background:var(--ok);border:none;border-radius:10px;width:44px;color:#06240f;cursor:pointer;font-size:16px;font-weight:700}
  #inp{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px}
  #send{background:var(--acc);border:none;border-radius:10px;width:44px;color:#fff;cursor:pointer;font-size:16px}
  #login{max-width:340px;margin:15vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  #login h2{font-size:16px;margin-bottom:12px}
  #roleHint{font-size:12px;color:var(--warn);margin-bottom:10px}
  #pin{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  #go{width:100%;background:var(--acc);border:none;color:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
  #backDash{width:100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;cursor:pointer;font-size:13px}
  #backDash:hover{color:var(--text);border-color:var(--acc)}
  h3{margin:12px 0 8px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<div id="login" class="hide">
  <h2>🏭 РЕМЕРА · внутренний чат</h2>
  <div id="roleHint" class="hide"></div>
  <input id="pin" type="password" placeholder="PIN" inputmode="numeric">
  <button id="go">Войти</button>
  <button id="backDash" onclick="location.href='/'">🏠 Вернуться в меню</button>
</div>

<div id="app" class="hide">
  <header>
    <span id="dot"></span>
    <b>🏭 РЕМЕРА · внутренний чат</b>
    <span id="who"></span>
    <a class="hdr-btn" href="/">🏠 Дашборд</a>
    <button id="logout">Выйти</button>
  </header>
  <div id="tabs" class="hide">
    <button class="tab on" data-t="chat">Чат</button>
    <button class="tab" data-t="stock">Остатки</button>
    <button class="tab" data-t="journal">Журнал</button>
  </div>
  <main>
    <div id="view-chat">
      <div id="queue"></div>
      <div id="feed"></div>
    </div>
    <div id="view-stock" class="hide">
      <h3>Остатки (только чтение)</h3>
      <table><thead><tr><th>Код</th><th>Остаток</th></tr></thead><tbody id="stockBody"></tbody></table>
    </div>
    <div id="view-journal" class="hide">
      <h3>Журнал движений (только чтение)</h3>
      <table><thead><tr><th>Время</th><th>Операция</th><th>Кол-во</th><th>Код</th><th>Остаток после</th><th>Кто</th></tr></thead><tbody id="movBody"></tbody></table>
    </div>
  </main>
  <div id="bar">
    <div id="builder">
      <select id="bCmd">
        <option value="расход">⚙️ Расход</option>
        <option value="приход">📥 Приход</option>
        <option value="отгрузка">🚚 Отгрузка</option>
        <option value="производство">🏭 Производство</option>
        <option value="/коды">📋 Коды</option>
        <option value="/список">❓ Справка</option>
      </select>
      <div class="combo">
        <input id="bCode" placeholder="Код или название…" autocomplete="off">
        <div id="bList" class="hide"></div>
      </div>
      <input id="bQty" type="number" min="0" step="any" placeholder="Кол-во">
      <button id="bSend">➤</button>
    </div>
    <div id="freeRow">
      <input id="inp" placeholder="или вручную: /расход 5 PA-F">
      <button id="send">➤</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let session=null, seenIds=new Set(), timer=null, curTab='chat';

const ROLE_NAMES={director:'Директор',accountant:'Бухгалтер',worker:'Работник'};
const urlRole=new URLSearchParams(location.search).get('role');

const NOM={'PA-F':'Нить полиамидная (капрон)','PES-F':'Нить полиэфирная','PP-F':'Нить полипропиленовая','PE-F':'Нить полиэтиленовая','HMPE-F':'Волокно HMPE (Dyneema)','ARAM-F':'Нить арамидная (Русар)','SIL-F':'Волокно кремнеземное','BAS-R':'Ровинг базальтовый','GLS-R':'Ровинг стеклянный','BOB-K':'Бобины картонные','BOB-P':'Бобины пластиковые','PKG-STR':'Стрейч-плёнка','PKG-BAG':'Пакеты ПЭ','STAT-10':'Верёвка статическая 10мм','STAT-11':'Верёвка статическая 11мм','DYN-105':'Верёвка динамическая 10.5мм','REP-6':'Репшнур 6мм','REP-7':'Репшнур 7мм (арамид)','ARAM-6':'Шнур арамидный 6мм','HMPE-6':'Канат HMPE 6мм','HMPE-10':'Канат HMPE 10мм','PA-8':'Канат ПА 8мм','PA-10':'Канат ПА 10мм','PA-12':'Канат ПА 12мм','PP-10':'Канат ПП 10мм','PP-16':'Канат ПП 16мм','PP-24':'Канат ПП 24мм','SIL-8':'Шнур кремнеземный 8мм','SIL-12':'Шнур кремнеземный 12мм','BAS-8':'Шнур базальтовый 8мм','BAS-10':'Шнур базальтовый 10мм','YAHT-8':'Канат яхтенный 8мм','FISH-25':'Шнур рыболовный 2.5мм','CABLE-6':'Канат для протяжки 6мм','FENCE-8':'Канат ограждающий 8мм','BAG-4':'Шнур для пакетов 4мм','BANNER-4':'Шнур баннерный 4мм'};

async function api(path,opts){
  const r=await fetch(path,opts);
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

function showLogin(){ $('login').classList.remove('hide'); $('app').classList.add('hide'); }
function showApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); }

$('go').onclick=async()=>{
  const pin=$('pin').value.trim();
  if(!pin) return;
  try{
    const j=await api('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    if(urlRole && j.role!==urlRole){
      alert('❌ Неверный PIN для роли «'+(ROLE_NAMES[urlRole]||urlRole)+'».\nЭтот код принадлежит другой роли — введите PIN ещё раз.');
      $('pin').value='';
      return;
    }
    session={pin,role:j.role,name:j.name};
    localStorage.setItem('wms2_session',JSON.stringify(session));
    start();
  }catch(e){ alert(e.message); $('pin').value=''; }
};
$('pin').onkeydown=e=>{ if(e.key==='Enter') $('go').click(); };
$('logout').onclick=()=>{ localStorage.removeItem('wms2_session'); location.reload(); };

function start(){
  showApp();
  $('who').textContent='· '+session.name+' ('+session.role+')';
  if(session.role==='accountant'){ $('bar').classList.add('hide'); $('tabs').classList.remove('hide'); }
  else if(session.role==='director'){ $('tabs').classList.remove('hide'); }
  else { $('tabs').classList.add('hide'); }
  seenIds=new Set(); $('feed').innerHTML=''; $('queue').innerHTML='';
  if(timer) clearInterval(timer);
  poll();
  timer=setInterval(poll,6000);
}

async function poll(){
  try{
    const d=await api('/api/chat?pin='+encodeURIComponent(session.pin)+'&since=0');
    $('dot').classList.add('on');
    for(const m of d.messages){
      if(seenIds.has(m.id)) continue;
      seenIds.add(m.id);
      addMsg(m);
    }
    if(session.role==='director') renderQueue(d.pending||[]);
    if(curTab==='stock'||curTab==='journal') await loadStock();
  }catch(e){
    console.error('[poll error]',e);
    $('dot').classList.remove('on');
  }
}

function addMsg(m){
  const div=document.createElement('div');
  div.className='msg'+(m.role==='system'?' sys':'')+((m.role===session.role&&m.role!=='system')?' me':'');
  div.innerHTML='<div class="meta">'+esc(m.author)+' · '+fmt(m.ts)+'</div>'+esc(m.text);
  $('feed').appendChild(div);
  div.scrollIntoView({block:'end'});
}

function renderQueue(list){
  const q=$('queue');
  q.innerHTML='';
  for(const p of list){
    const div=document.createElement('div');
    div.className='qcard';
    div.innerHTML='⏳ '+esc(p.label)+': <b>'+p.qty+' × '+esc(p.code)+'</b> ('+esc(p.name)+')'+
      '<div class="muted">'+esc(p.author)+' · '+fmt(p.ts)+'</div>'+
      '<div class="row"><button class="ok" data-a="approve" data-id="'+p.id+'">Провести</button>'+
      '<button class="bad" data-a="reject" data-id="'+p.id+'">Отклонить</button></div>';
    q.appendChild(div);
  }
}

$('queue').onclick=async(e)=>{
  const b=e.target.closest('button[data-id]');
  if(!b) return;
  b.disabled=true;
  try{
    await api('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:session.pin,id:b.dataset.id,action:b.dataset.a})});
    poll();
  }catch(err){ alert(err.message); b.disabled=false; }
};

// --- отправка ---
async function sendText(text){
  text=String(text||'').trim();
  if(!text) return;
  $('send').disabled=true; $('bSend').disabled=true;
  try{
    await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:session.pin,text})});
    poll();
  }catch(e){ alert(e.message); }
  $('send').disabled=false; $('bSend').disabled=false;
}
$('send').onclick=()=>{ const t=$('inp').value; $('inp').value=''; sendText(t); };
$('inp').onkeydown=e=>{ if(e.key==='Enter') $('send').click(); };

// --- конструктор команды: поиск кода ---
function renderCodeList(q){
  const s=String(q||'').trim().toLowerCase();
  const items=Object.entries(NOM)
    .filter(([c,n])=>!s||c.toLowerCase().includes(s)||n.toLowerCase().includes(s))
    .slice(0,8);
  const L=$('bList');
  if(!items.length){ L.classList.add('hide'); return; }
  L.innerHTML=items.map(([c,n])=>'<div class="bItem" data-c="'+c+'"><b>'+c+'</b> — '+esc(n)+'</div>').join('');
  L.classList.remove('hide');
}
$('bCode').addEventListener('focus',()=>renderCodeList($('bCode').value));
$('bCode').addEventListener('input',()=>renderCodeList($('bCode').value));
$('bList').addEventListener('mousedown',e=>{
  const it=e.target.closest('.bItem');
  if(!it) return;
  $('bCode').value=it.dataset.c;
  $('bList').classList.add('hide');
});
$('bCode').addEventListener('blur',()=>setTimeout(()=>$('bList').classList.add('hide'),150));

$('bSend').onclick=async()=>{
  const cmd=$('bCmd').value;
  if(cmd.startsWith('/')){ sendText(cmd); return; }
  const code=$('bCode').value.trim().toUpperCase();
  const qty=parseFloat(String($('bQty').value).replace(',','.'));
  if(!NOM[code]){ alert('Выбери код из выпадающего списка (начни писать код или название).'); return; }
  if(!(qty>0)){ alert('Укажи количество больше нуля.'); return; }
  $('bQty').value='';
  sendText('/'+cmd+' '+qty+' '+code);
};

// --- вкладки ---
$('tabs').onclick=e=>{
  const t=e.target.closest('.tab');
  if(!t) return;
  curTab=t.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('view-chat').classList.toggle('hide',curTab!=='chat');
  $('view-stock').classList.toggle('hide',curTab!=='stock');
  $('view-journal').classList.toggle('hide',curTab!=='journal');
  if(curTab!=='chat') loadStock();
};

async function loadStock(){
  try{
    const d=await api('/api/stock?pin='+encodeURIComponent(session.pin));
    const codes=Object.keys(d.stock||{});
    $('stockBody').innerHTML=codes.length
      ? codes.map(c=>'<tr><td>'+esc(c)+'</td><td><b>'+d.stock[c]+'</b></td></tr>').join('')
      : '<tr><td colspan="2">Пока пусто</td></tr>';
    $('movBody').innerHTML=(d.movements||[]).length
      ? (d.movements||[]).map(m=>'<tr><td>'+fmt(m.ts)+'</td><td>'+esc(m.label)+(m.status==='rejected'?' ❌':'')+'</td><td>'+(m.sign>0?'+':'−')+m.qty+'</td><td>'+esc(m.code)+'</td><td>'+(m.next??'—')+'</td><td>'+esc(m.decidedBy||m.author||'')+'</td></tr>').join('')
      : '<tr><td colspan="6">Пока пусто</td></tr>';
  }catch(e){ console.error('[stock error]',e); }
}

(function init(){
  if(urlRole && ROLE_NAMES[urlRole]){
    $('roleHint').textContent='👤 Вход в роли: '+ROLE_NAMES[urlRole];
    $('roleHint').classList.remove('hide');
  }
  try{ session=JSON.parse(localStorage.getItem('wms2_session')||'null'); }catch(e){ session=null; }
  if(session && session.pin && (!urlRole || session.role===urlRole)) start();
  else { session=null; showLogin(); }
})();
</script>
</body>
</html>
